<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time State Sync - Collaborative System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 rounded-2xl shadow-2xl p-8 max-w-md w-full border border-gray-700">
        <!-- Room ID -->
        <div class="mb-6">
            <label class="block text-gray-400 text-sm mb-2">Room ID (แชร์ให้เพื่อน)</label>
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="roomId" 
                    class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-lime-400"
                    placeholder="สร้างหรือใส่ Room ID"
                />
                <button 
                    onclick="joinRoom()"
                    class="bg-lime-400 hover:bg-lime-600 text-white px-4 py-2 rounded-lg transition"
                >
                    Join
                </button>
            </div>
        </div>

        <!-- Counter Display -->
        <div class="text-center mb-8">
            <div class="text-gray-400 text-sm mb-2">Global Counter</div>
            <div id="counter" class="text-7xl font-bold text-white mb-4 transition-all duration-200">0</div>
            <div class="flex gap-4 justify-center">
                <button 
                    onclick="updateCounter(-1)"
                    class="bg-lime-300 hover:bg-lime-100 text-lime-800 w-16 h-16 rounded-xl text-2xl font-bold transition transform hover:scale-105 active:scale-95"
                >
                    -1
                </button>
                <button 
                    onclick="updateCounter(1)"
                    class="bg-lime-500 hover:bg-lime-600 text-lime-800 w-16 h-16 rounded-xl text-2xl font-bold transition transform hover:scale-105 active:scale-95"
                >
                    +1
                </button>
            </div>
        </div>

        <!-- Users Online -->
        <div class="mb-4">
            <div class="text-gray-400 text-sm mb-2">
                🟢 Online Users: <span id="onlineCount" class="text-white font-bold">1</span>
            </div>
            <div id="userList" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- History Log -->
        <div>
            <div class="text-gray-400 text-sm mb-2">ประวัติการเปลี่ยนแปลง</div>
            <div id="historyLog" class="bg-gray-900 rounded-lg p-3 h-32 overflow-y-auto text-sm space-y-1">
                <div class="text-gray-600">ยังไม่มีการเปลี่ยนแปลง</div>
            </div>
        </div>

        <!-- Status -->
        <div id="status" class="mt-4 text-center text-sm">
            <span class="text-yellow-500">ยังไม่ได้เชื่อมต่อห้อง</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
