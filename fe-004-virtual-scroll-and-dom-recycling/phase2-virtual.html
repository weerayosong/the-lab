<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Phase 2: Virtual Scroll + DOM Recycling</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: "#3b82f6",
                            surface: "#1e293b",
                            border: "#334155",
                        },
                    },
                },
            };
        </script>
    </head>
    <body class="bg-green-950 text-slate-100 min-h-screen font-mono">
        <!-- Header -->
        <header
            class="bg-green-900 border-b border-green-800 px-6 py-4 sticky top-0 z-10"
        >
            <div class="max-w-6xl mx-auto flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold text-green-400">
                        🟢 Phase 2: Virtual Scroll + DOM Recycling
                    </h1>
                    <p class="text-xs text-green-300 mt-0.5">
                        100,000 rows — Only ~30 DOM Nodes
                    </p>
                </div>
                <div class="flex gap-6 text-sm">
                    <div class="text-right">
                        <p class="text-slate-400">แถวทั้งหมด</p>
                        <p id="totalRows" class="font-bold text-lg">100,000</p>
                    </div>
                    <div class="text-right">
                        <p class="text-slate-400">DOM Nodes</p>
                        <p
                            id="domCount"
                            class="font-bold text-lg text-green-400"
                        >
                            -
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="text-slate-400">FPS</p>
                        <p
                            id="fpsCounter"
                            class="font-bold text-lg text-green-400"
                        >
                            -
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="text-slate-400">Render Time</p>
                        <p
                            id="renderTime"
                            class="font-bold text-lg text-green-400"
                        >
                            -
                        </p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Table -->
        <main class="max-w-6xl mx-auto p-6">
            <div
                class="bg-slate-900 rounded-lg border border-green-800 overflow-hidden"
            >
                <!-- Table Header -->
                <div
                    class="grid grid-cols-5 gap-4 px-6 py-3 bg-slate-800 text-xs font-semibold uppercase tracking-wider text-slate-300 border-b border-slate-700 sticky top-0 z-10"
                >
                    <div>#</div>
                    <div>ชื่อ</div>
                    <div>อีเมล</div>
                    <div>ยอดเงิน</div>
                    <div>สถานะ</div>
                </div>

                <!-- Virtual Scroll Container -->
                <div
                    id="scrollContainer"
                    class="overflow-y-auto relative"
                    style="height: 600px"
                >
                    <!-- Spacer: ดัน scrollbar ให้สูงเท่ากับข้อมูลทั้งหมด -->
                    <div id="scrollSpacer"></div>

                    <!-- Visible Area: แสดงเฉพาะแถวที่เห็น -->
                    <div id="visibleArea" class="absolute top-0 left-0 w-full">
                        <!-- Dynamic rows จะถูก inject ที่นี่ -->
                    </div>
                </div>
            </div>
        </main>

        <script>
            // ============================================================
            // Phase 2: Virtual Scroll + DOM Recycling
            // ============================================================

            const TOTAL_ROWS = 100_000;
            const ROW_HEIGHT = 49; // px (ความสูงต่อแถว: py-3 + border = ~49px)
            const BUFFER_ROWS = 5; // แถวเผื่อด้านบน/ล่าง นอก viewport

            const scrollContainer = document.getElementById("scrollContainer");
            const scrollSpacer = document.getElementById("scrollSpacer");
            const visibleArea = document.getElementById("visibleArea");
            const DOM_COUNT_EL = document.getElementById("domCount");
            const FPS_EL = document.getElementById("fpsCounter");
            const RENDER_TIME_EL = document.getElementById("renderTime");

            // ---------- Data Generator ----------
            function generateData(count) {
                const firstNames = [
                    "สมแมว",
                    "สมเหมียว",
                    "สมโฮ่ง",
                    "สมบ๊อกบ๊อก",
                    "สมอ๋อง",
                    "สมแอ๋ง",
                    "สมใจ",
                    "สมถวิล",
                    "สมบูรณ์",
                    "สมศรี",
                ];
                const lastNames = [
                    "เมตตา",
                    "รุ่งเรือง",
                    "สุขสบาย",
                    "มั่งมี",
                    "ศรีสุข",
                    "อบอุ่น",
                    "ทำบุญ",
                    "ยินดี",
                    "จริงใจ",
                    "เผื่อแผ่",
                ];
                const statuses = ["active", "inactive", "pending"];

                const data = [];
                for (let i = 0; i < count; i++) {
                    data.push({
                        id: i + 1,
                        name: `${firstNames[i % 10]} ${lastNames[Math.floor(i / 10) % 10]}`,
                        email: `user${i + 1}@example.com`,
                        balance: (Math.random() * 9000000).toFixed(2),
                        status: statuses[i % 3],
                    });
                }
                return data;
            }

            // ---------- FPS Counter ----------
            let frameCount = 0;
            let lastTime = performance.now();

            function updateFPS() {
                frameCount++;
                const now = performance.now();
                if (now - lastTime >= 1000) {
                    FPS_EL.textContent = frameCount;
                    frameCount = 0;
                    lastTime = now;
                }
                requestAnimationFrame(updateFPS);
            }

            // ---------- DOM Pool (Recycling) ----------
            const rowPool = []; // เก็บ DOM elements ที่สร้างไว้แล้ว นำกลับมาใช้ใหม่

            function getRowFromPool() {
                return rowPool.pop() || createRowElement();
            }

            function returnRowToPool(rowEl) {
                rowEl.style.display = "none";
                rowPool.push(rowEl);
            }

            function createRowElement() {
                const rowDiv = document.createElement("div");
                rowDiv.className =
                    "grid grid-cols-5 gap-4 px-6 border-b border-slate-800 hover:bg-slate-800/50 transition-colors text-sm";
                rowDiv.style.height = `${ROW_HEIGHT}px`;
                rowDiv.style.alignItems = "center";

                // สร้าง cells ล่วงหน้า (เร็วกว่า innerHTML)
                const cells = [];
                for (let i = 0; i < 5; i++) {
                    const cell = document.createElement("div");
                    rowDiv.appendChild(cell);
                    cells.push(cell);
                }

                // เก็บ cells ไว้กับ element
                rowDiv._cells = cells;
                return rowDiv;
            }

            function updateRowContent(rowEl, data) {
                const [idCell, nameCell, emailCell, balanceCell, statusCell] =
                    rowEl._cells;

                idCell.textContent = data.id.toLocaleString();
                idCell.className = "text-slate-500";

                nameCell.textContent = data.name;
                nameCell.className = "";

                emailCell.textContent = data.email;
                emailCell.className = "text-slate-400";

                balanceCell.textContent = `${Number(data.balance).toLocaleString()} ฿`;
                balanceCell.className = "text-right tabular-nums";

                const statusColor =
                    data.status === "active"
                        ? "text-green-400"
                        : data.status === "inactive"
                          ? "text-red-400"
                          : "text-yellow-400";
                statusCell.textContent = data.status;
                statusCell.className = `${statusColor} font-medium`;
            }

            // ---------- Virtual Scroll Logic ----------
            let currentStartIndex = -1;
            let renderedRows = []; // track rows ที่ render อยู่

            function renderVisibleRows(scrollTop) {
                const containerHeight = scrollContainer.clientHeight;

                // คำนวณว่าแถวไหนควรแสดง
                const startIndex = Math.max(
                    0,
                    Math.floor(scrollTop / ROW_HEIGHT) - BUFFER_ROWS,
                );
                const visibleCount = Math.ceil(containerHeight / ROW_HEIGHT);
                const endIndex = Math.min(
                    TOTAL_ROWS,
                    startIndex + visibleCount + BUFFER_ROWS * 2,
                );

                // ถ้าไม่เปลี่ยน range ไม่ต้อง render ใหม่
                if (startIndex === currentStartIndex) return;
                currentStartIndex = startIndex;

                // 1. เก็บ rows เก่ากลับ pool
                for (const rowEl of renderedRows) {
                    returnRowToPool(rowEl);
                }
                renderedRows = [];
                visibleArea.innerHTML = "";

                // 2. ดึง rows จาก pool มาใช้ใหม่ (หรือสร้างใหม่ถ้า pool ว่าง)
                for (let i = startIndex; i < endIndex; i++) {
                    const rowEl = getRowFromPool();
                    rowEl.style.display = "";
                    updateRowContent(rowEl, mockData[i]);
                    rowEl.style.position = "absolute";
                    rowEl.style.top = `${i * ROW_HEIGHT}px`;
                    rowEl.style.left = "0";
                    rowEl.style.width = "100%";

                    visibleArea.appendChild(rowEl);
                    renderedRows.push(rowEl);
                }

                // 3. อัพเดท DOM count
                DOM_COUNT_EL.textContent = renderedRows.length.toString();
            }

            // ---------- Init ----------
            let mockData = [];

            function init() {
                const startTime = performance.now();

                console.log(`🟢 PHASE 2: Virtual Scroll + DOM Recycling`);
                console.log(
                    `📊 Generating ${TOTAL_ROWS.toLocaleString()} rows...`,
                );
                mockData = generateData(TOTAL_ROWS);
                console.log("✅ Data generated!");

                // Set spacer height = ข้อมูลทั้งหมด
                scrollSpacer.style.height = `${TOTAL_ROWS * ROW_HEIGHT}px`;
                visibleArea.style.height = `${TOTAL_ROWS * ROW_HEIGHT}px`;

                document.getElementById("totalRows").textContent =
                    TOTAL_ROWS.toLocaleString();

                // Render ครั้งแรก
                renderVisibleRows(0);

                // Scroll Event (ใช้ requestAnimationFrame เพื่อ performance)
                let ticking = false;
                scrollContainer.addEventListener("scroll", () => {
                    if (!ticking) {
                        requestAnimationFrame(() => {
                            renderVisibleRows(scrollContainer.scrollTop);
                            ticking = false;
                        });
                        ticking = true;
                    }
                });

                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(0);
                RENDER_TIME_EL.textContent = `${duration} ms`;

                console.log(`⏱️ Render Time: ${duration} ms`);
                console.log(`📦 DOM Nodes:  ${renderedRows.length}`);
                console.log(
                    `♻️  Pool Size:  ${rowPool.length} ready for reuse`,
                );
                console.log(
                    "✅ Virtual Scroll Active! ลอง scroll ดูความลื่น 🚀",
                );
            }

            init();
            updateFPS();
        </script>
    </body>
</html>
